name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit and zip
        run: sudo apt-get update && sudo apt-get install -y luajit zip unzip
      - name: Check the tag matches the addon version
        run: |
          version=$(sed -n 's/^## Version: *//p' WoWCompanion/WoWCompanion.toc)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match TOC version v$version" >&2
            exit 1
          fi
      - name: Run the Lua tests
        run: make verify
      - name: Build the zip
        run: |
          zip_path=$(scripts/package.sh)
          luajit tests/layout.lua "$zip_path"
          echo "ZIP=$zip_path" >> "$GITHUB_ENV"
      - name: Attach the zip to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
